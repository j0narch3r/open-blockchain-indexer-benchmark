[project]
name = "contour-api"
version = "0.1.0"
description = "Contour API — elevation-optimized bicycle routing for San Francisco"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "rasterio",
  "numpy",
  "scipy",
  "pyproj",
  "shapely",
  "pyyaml",
  "httpx",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "types-pyyaml",
  "jsonschema",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contour"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

# rasterio ships no py.typed marker and no `types-rasterio` stub package
# exists on PyPI (checked Task 4) — mypy strict has no way to type-check
# against it. Narrowly scoped to the one module, not a blanket
# ignore_missing_imports, per docs/DECISIONS.md Task 4.
[[tool.mypy.overrides]]
module = "rasterio.*"
ignore_missing_imports = true

# scipy ships no py.typed marker either (checked Task 6); the matching
# `scipy-stubs` PyPI package's latest release (1.17.1.5) trails the
# installed scipy (1.18.0) and adding a new dependency needs its own
# justification (Global Constraints) that a two-line mypy override
# doesn't. Narrowly scoped to `scipy.signal` (the only scipy submodule
# `contour/` imports), same pattern as the `rasterio.*` override above.
# See docs/DECISIONS.md Task 6.
[[tool.mypy.overrides]]
module = "scipy.signal"
ignore_missing_imports = true

# `scripts/make_fixture_dem.py` lives outside `services/api` (design doc
# §8 repo layout) and is loaded at test runtime via an explicit
# `sys.path.insert` in tests/test_fixture_dem.py, not as an installed or
# in-tree package — mypy's project root here has no static view of it.
# See docs/DECISIONS.md Task 4 for why the generator itself isn't folded
# into `services/api` instead.
[[tool.mypy.overrides]]
module = "make_fixture_dem"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # starlette 1.6.0's TestClient nags to install the brand-new "httpx2"
  # package in place of httpx; see docs/DECISIONS.md (Task 3) for why we
  # keep httpx instead of adopting an unvetted replacement mid-task.
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
